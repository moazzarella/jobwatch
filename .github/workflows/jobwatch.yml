name: jobwatch

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may run a few minutes late)
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

concurrency:
  group: jobwatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Restore seen-jobs state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: jobwatch-state-${{ github.run_id }}
          restore-keys: jobwatch-state-

      - name: Check for new jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Sources this runner handles. Set the repo variable JOBWATCH_SOURCES to change it
          # (for example "freelancer" if Mostaql blocks GitHub and the Mac handles Mostaql).
          JOBWATCH_SOURCES: ${{ vars.JOBWATCH_SOURCES || 'freelancer,mostaql' }}
          JOBWATCH_RUNNER: GitHub
        run: python3 jobwatch.py

      - name: Save seen-jobs state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: jobwatch-state-${{ github.run_id }}
